                                        $ref: "#/components/schemas/ProfileResponseDTO"
                "401": { $ref: "#/components/responses/Unauthorized" }
        put:
            tags: [Users]
            summary: Update current user's profile
            security:
                - bearerAuth: []
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: "#/components/schemas/UpdateProfileDTO"
            responses:
                "200":
                    description: OK
                    content:
