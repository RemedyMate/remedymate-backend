paths:
    /api/v1/user/profile/onboarding-status:
        get:
          summary: Get onboarding status for the authenticated user
          description: Returns the current onboarding progress including completion percentage, next required step, and detailed status for each section.
          tags: [Users]
          responses:
            '200':
              description: Onboarding status retrieved successfully
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/OnboardingStatusResponse"
                  examples:
                    partial_complete:
                      value:
                        percent_complete: 50
                        next_step: "demographics"
                        sections:
                          consent:
                            complete: true
                            last_updated: "2024-01-15T10:30:00Z"
                          demographics:
                            complete: false
                            last_updated: "2024-01-15T09:15:00Z"
                          medical_history:
                            complete: false
                            last_updated: "2024-01-15T09:15:00Z"
                          lifestyle:
                            complete: false
                            last_updated: "2024-01-15T09:15:00Z"
                    fully_complete:
                      value:
                        percent_complete: 100
                        next_step: ""
                        sections:
                          consent:
                            complete: true
                            last_updated: "2024-01-15T10:30:00Z"
                          demographics:
                            complete: true
                            last_updated: "2024-01-15T10:45:00Z"
                          medical_history:
                            complete: true
                            last_updated: "2024-01-15T11:00:00Z"
                          lifestyle:
                            complete: true
                            last_updated: "2024-01-15T11:15:00Z"
            '401':
              $ref: "#/components/responses/Unauthorized"
            '500':
              description: Internal server error
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/ErrorResponse"
                  example:
                    error: "Failed to retrieve onboarding status"
          security:
            - bearerAuth: []

    /api/v1/user/profile/consent:
        post:
          summary: Record granular consents for user
          description: Records initial consent preferences for data processing, sharing, and privacy policies.
          tags: [Users]
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/ConsentPostRequest"
                examples:
                  baseline_consents:
                    value:
                      consents:
                        - type: "TERMS_OF_SERVICE"
                          granted: true
                          purpose: "baseline"
                          version: "1.0"
                        - type: "PRIVACY_POLICY"
                          granted: true
                          purpose: "baseline"
                          version: "1.0"
                        - type: "DATA_PROCESSING"
                          granted: true
                          purpose: "baseline"
                          version: "1.0"
                  with_optional:
                    value:
                      consents:
                        - type: "TERMS_OF_SERVICE"
                          granted: true
                          purpose: "baseline"
                          version: "1.0"
                        - type: "DATA_SHARING_RESEARCH"
                          granted: false
                          purpose: "optional"
                          version: "1.0"
          responses:
            '201':
              description: Consent records created successfully
              content:
                application/json:
                  schema:
                    type: object
                    properties:
                      message:
                        type: string
                        example: "Consent recorded successfully"
            '400':
              description: Bad request - invalid consent data
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/ErrorResponse"
                  example:
                    error: "Invalid request body"
            '401':
              $ref: "#/components/responses/Unauthorized"
          security:
            - bearerAuth: []
        patch:
          summary: Update or revoke consents (append-only revocation record)
          description: Updates consent preferences or records revocation of previously granted consents.
          tags: [Users]
          requestBody:
            required: true
            content:
              application/json:
                schema:
                  $ref: "#/components/schemas/ConsentPatchRequest"
                examples:
                  revoke_consent:
                    value:
                      consents:
                        - type: "DATA_SHARING_RESEARCH"
                          granted: false
                          revocation_reason: "Changed my mind about research participation"
          responses:
            '200':
              description: Consent records updated successfully
              content:
                application/json:
                  schema:
                    type: object
                    properties:
                      message:
                        type: string
                        example: "Consents updated successfully"
            '400':
              description: Bad request - invalid consent data
              content:
                application/json:
                  schema:
                    $ref: "#/components/schemas/ErrorResponse"
                  example:
                    error: "Invalid request body"
            '401':
              $ref: "#/components/responses/Unauthorized"
          security:
            - bearerAuth: []

    /api/v1/user/profile/demographics:
        put:
          summary: Create or update user demographics
